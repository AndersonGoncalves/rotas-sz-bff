services:
  api:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      SERVER_PORT: 3001
      AWS_BUCKET_NAME: api-node-storage-anderson-goncalves
      AWS_REGION: us-east-1
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    # Proteção contra acúmulo de logs no disco
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Proteção contra acúmulo de logs no disco
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data: